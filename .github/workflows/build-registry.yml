name: Build registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - marketplace.json
      - plugins/**
      - scripts/build_registry.py

permissions:
  contents: write

concurrency:
  group: marketplace-registry

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_registry.py
      - name: Commit registry
        run: |
          git add public/registry.json
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: update marketplace registry"
          git push
